<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B1C22" />
      <stop offset="50%" stop-color="#801217" />
      <stop offset="100%" stop-color="#600A0E" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Shield Border -->
  <path d="M 250,15 
           C 340,30 430,45 475,70 
           C 475,230 460,370 250,545 
           C 40,370 25,230 25,70 
           C 70,45 160,30 250,15 Z" 
        fill="none" 
        stroke="url(#shieldRed)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#subtleShadow)" />

  <!-- Inner Shield Accent Line -->
  <path d="M 250,35 
           C 330,48 410,62 450,84 
           C 450,226 436,350 250,515 
           C 64,350 50,226 50,84 
           C 90,62 170,48 250,35 Z" 
        fill="none" 
        stroke="#801217" 
        stroke-opacity="0.15" 
        stroke-width="3" />

  <!-- Stylized Letter 'A' Monogram -->
  <!-- Left Leg & Apex Swoop -->
  <path d="M 140,340 
           L 245,100 
           C 255,80 270,80 280,95 
           L 385,340 
           C 390,352 380,360 365,360 
           L 330,360 
           C 318,360 312,352 308,340 
           L 295,305 
           C 260,320 220,325 180,310 
           L 165,340 
           C 160,352 150,360 135,360 
           L 120,360 
           C 105,360 100,350 110,335 Z" 
        fill="url(#shieldRed)" />

  <!-- Dynamic Curved Inner A Wave / Swash -->
  <path d="M 185,250 
           C 220,200 270,185 315,225 
           C 340,247 310,275 275,270 
           C 235,264 205,285 185,250 Z" 
        fill="url(#shieldRed)" />

  <!-- Red Accent Line detail on the A bar -->
  <path d="M 195,245 
           Q 240,165 295,220 
           Q 320,245 285,252 
           Q 245,250 205,235" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="6" 
        stroke-linecap="round" />
</svg>
